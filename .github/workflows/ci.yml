# Modified for NotchLite: pinned actions, tests and portable preview artifact.
name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.100.0-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.100.0-x86_64-pc-windows-gnu --profile minimal --no-self-update
          $gnuTools = Join-Path (rustc --print sysroot) 'lib/rustlib/x86_64-pc-windows-gnu/bin/self-contained'
          $gnuTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Unit tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Package portable preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/NotchLite-portatile | Out-Null
          Copy-Item target/release/notchlite.exe,LICENSE,NOTICE -Destination artifact/NotchLite-portatile
          Copy-Item docs/TRY-IT.md artifact/NotchLite-portatile/README.md
          Compress-Archive -Path artifact/NotchLite-portatile -DestinationPath artifact/NotchLite-portatile.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NotchLite-portatile-windows-x64
          path: artifact/NotchLite-portatile.zip
          if-no-files-found: error
          retention-days: 14
