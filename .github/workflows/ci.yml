# Modified for NotchLite: pinned actions, tests and portable preview artifact.
name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.100.0-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: rustup toolchain install 1.100.0-x86_64-pc-windows-msvc --profile minimal --no-self-update
      - name: Unit tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Package portable preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/NotchLite-portatile | Out-Null
          Copy-Item target/release/notchlite.exe,LICENSE,NOTICE -Destination artifact/NotchLite-portatile
          Copy-Item assets/icon/ada.ico artifact/NotchLite-portatile/notchlite.ico
          Copy-Item docs/TRY-IT.md artifact/NotchLite-portatile/README.md
          Copy-Item docs/APPEARANCE.md artifact/NotchLite-portatile/APPEARANCE.md
          Copy-Item docs/PERFORMANCE-0.1.11.md artifact/NotchLite-portatile
          Copy-Item docs/PERFORMANCE-0.1.12.md artifact/NotchLite-portatile
          Copy-Item docs/PERFORMANCE-0.1.13.md artifact/NotchLite-portatile
          New-Item -ItemType Directory -Force -Path artifact/NotchLite-portatile/review | Out-Null
          Copy-Item docs/review/iteration-13 artifact/NotchLite-portatile/review -Recurse
          Copy-Item docs/review/iteration-14 artifact/NotchLite-portatile/review -Recurse
          Copy-Item docs/TEAMS-DIAGNOSTICS.md artifact/NotchLite-portatile
          New-Item -ItemType Directory -Force -Path artifact/NotchLite-portatile/research | Out-Null
          Copy-Item docs/research/EXTERNAL-CHAT-OPTIONS.md artifact/NotchLite-portatile/research
          Copy-Item docs/DESKTOP-CLOCK.md artifact/NotchLite-portatile/DESKTOP-CLOCK.md
          Copy-Item docs/MODERN-NAVIGATION.md,docs/PHONE-SHARE.md artifact/NotchLite-portatile
          Copy-Item docs/COMPANION.md artifact/NotchLite-portatile
          Copy-Item docs/CODEX-DASHBOARD.md,docs/CALL-ASSISTANT.md artifact/NotchLite-portatile
          Copy-Item docs/SCREEN-PRIVACY.md artifact/NotchLite-portatile
          Copy-Item docs/MONITORS.md artifact/NotchLite-portatile
          Copy-Item docs/CODEX-SHARED-SERVER.md artifact/NotchLite-portatile
          Copy-Item docs/CALL-LIVE.md,docs/CALL-TRANSCRIPTION.md artifact/NotchLite-portatile
          New-Item -ItemType Directory artifact/NotchLite-portatile/tools | Out-Null
          Copy-Item tools/Setup-CodexSharedServer.ps1 artifact/NotchLite-portatile/tools
          Copy-Item tools/Setup-CallTranscription.ps1 artifact/NotchLite-portatile/tools
          Copy-Item licenses -Recurse artifact/NotchLite-portatile/licenses
          New-Item -ItemType Directory -Force artifact/NotchLite-portatile/assets | Out-Null
          Copy-Item docs/assets/navigation-preview.png artifact/NotchLite-portatile/assets
          Compress-Archive -Path artifact/NotchLite-portatile -DestinationPath artifact/NotchLite-portatile.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NotchLite-portatile-windows-x64
          path: artifact/NotchLite-portatile.zip
          if-no-files-found: error
          retention-days: 14
